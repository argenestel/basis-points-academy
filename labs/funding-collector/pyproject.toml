[project]
name = "funding-collector"
version = "0.1.0"
description = "Collect perp funding rates from Hyperliquid, Binance and Bybit, store them, and rank cross-venue carry."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funding_collector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
