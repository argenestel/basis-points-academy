[project]
name = "perp-engine"
version = "0.1.0"
description = "A perp margin engine with funding and a full liquidation waterfall (book, backstop vault, insurance fund, ADL)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perp_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
