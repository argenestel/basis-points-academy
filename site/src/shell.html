<title>Basis Points Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a ledger-style sidebar (balance in bps, streak, nav) beside a scrolling learning path whose nodes zigzag like a price path */
:root {
  --bg: #F2F3EE; --panel: #FFFFFF; --panel-2: #E8EAE3; --ink: #131A16; --ink-2: #4A5650; --line: #D3D8CE;
  --accent: #3B39F0; --accent-deep: #2422B8; --accent-ink: #FFFFFF; --accent-soft: #E5E5FD;
  --gold: #9A600C; --gold-soft: #FBEFD6; --long: #0C7F55; --long-soft: #DBF1E6; --short: #C93434; --short-soft: #FBE3E1;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 14px; --amp: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D110F; --panel: #151A17; --panel-2: #1C231F; --ink: #E5EBE7; --ink-2: #9AA79F; --line: #2B3430;
    --accent: #8C8AFF; --accent-deep: #5B59D6; --accent-ink: #0D110F; --accent-soft: #222245;
    --gold: #F0B54A; --gold-soft: #33280F; --long: #44D392; --long-soft: #11301F; --short: #FF7070; --short-soft: #3A1717;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D110F; --panel: #151A17; --panel-2: #1C231F; --ink: #E5EBE7; --ink-2: #9AA79F; --line: #2B3430;
  --accent: #8C8AFF; --accent-deep: #5B59D6; --accent-ink: #0D110F; --accent-soft: #222245;
  --gold: #F0B54A; --gold-soft: #33280F; --long: #44D392; --long-soft: #11301F; --short: #FF7070; --short-soft: #3A1717;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 40px; max-width: 1220px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto;
  padding-block: 24px; display: flex; flex-direction: column; gap: 22px; }
main { min-width: 0; padding-block: 30px 96px; }
main:focus { outline: none; }

.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.mark { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  font: 900 19px/1 var(--f-display); font-stretch: 125%; box-shadow: 0 3px 0 var(--accent-deep); letter-spacing: -0.02em; }
.brand .name { font: 800 17px/1.1 var(--f-display); font-stretch: 110%; }

.stats { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.bal { display: flex; align-items: baseline; gap: 8px; }
.bal .num { font: 900 42px/1 var(--f-display); font-stretch: 125%; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--ink); }
.bal .unit { font: 600 12px/1 var(--f-mono); color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; }
.bal-sub { font: 400 12px/1.4 var(--f-mono); color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv div { display: grid; gap: 2px; }
.kv .k { font: 600 11px/1 var(--f-mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.08em; }
.kv .v { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.goal { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.sync { font: 400 12px/1.4 var(--f-mono); color: var(--ink-2); }

.nav { display: grid; gap: 4px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 700; }
.nav a:hover { background: var(--panel); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.nav .count { font: 600 11px/1 var(--f-mono); opacity: .7; }
.side-foot { display: grid; gap: 8px; font-size: 12px; color: var(--ink-2); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; font: inherit; justify-self: start; }

@media (max-width: 880px) {
  :root { --amp: .28; }
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; max-height: none; overflow: visible; background: var(--bg);
    box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax); padding-block: 10px; gap: 10px; border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; }
  .brand .name { display: none; }
  .mark { width: 38px; height: 38px; font-size: 16px; }
  .stats { padding: 0; border: 0; background: none; grid-template-columns: auto auto; justify-content: end; align-items: center; gap: 14px; }
  .bal .num { font-size: 24px; }
  .bal-sub, .goal, .sync { display: none; }
  .kv { grid-template-columns: auto auto; gap: 14px; }
  .kv .v { font-size: 13px; }
  .nav { grid-column: 1 / -1; display: flex; overflow-x: auto; gap: 6px; scrollbar-width: none; }
  .nav a { flex: none; padding: 8px 12px; font-size: 14px; }
  .side-foot { display: none; }
  main { padding-block: 20px 80px; }
}

/* shared */
.eyebrow { font: 600 12px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.lede { font-size: 18px; color: var(--ink-2); max-width: 64ch; }
.muted { color: var(--ink-2); }
.btn { font: 700 15px/1 var(--f-body); padding: 12px 18px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  cursor: pointer; box-shadow: 0 3px 0 var(--line); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-deep); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; font: 600 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px;
  background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { font: 700 13px/1 var(--f-body); padding: 9px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { width: 100%; font: 400 16px/1.4 var(--f-body); padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); }
.view-head { display: grid; gap: 12px; margin-bottom: 26px; }
.view-head h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 800; font-stretch: 108%; line-height: 1.05; }

/* learn */
.learn-head { display: grid; gap: 14px; margin-bottom: 18px; }
.learn-head h1 { font-size: clamp(34px, 5.4vw, 60px); font-weight: 850; font-stretch: 115%; line-height: .98; letter-spacing: -0.025em; }
.learn-head .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 6px; }
.jump button { font: 700 13px/1 var(--f-mono); width: 40px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.jump button.full { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.unit { margin-top: 34px; scroll-margin-top: 120px; }
.unit-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px 20px; }
.unit-num { font: 900 54px/0.9 var(--f-display); font-stretch: 125%; color: var(--accent); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.unit-head h2 { font-size: 22px; font-weight: 800; font-stretch: 105%; line-height: 1.15; margin-top: 4px; }
.unit-head p.d { color: var(--ink-2); font-size: 14.5px; margin-top: 4px; max-width: 62ch; }
.ring { display: grid; place-items: center; gap: 2px; font: 600 12px/1 var(--f-mono); color: var(--ink-2); }
.ring svg { display: block; }
@media (max-width: 560px) { .unit-head { grid-template-columns: auto minmax(0, 1fr); } .ring { display: none; } .unit-num { font-size: 40px; } }

.path { list-style: none; margin: 0; padding: 26px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 16px; overflow-x: clip; }
.node { display: flex; align-items: center; gap: 14px; width: min(430px, 100%); transform: translateX(calc(var(--x) * var(--amp) * 1px)); }
.node-btn { flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; text-decoration: none; font: 800 21px/1 var(--f-display);
  border: 3px solid var(--line); background: var(--panel); color: var(--ink-2); box-shadow: 0 5px 0 var(--line); transition: transform .1s; }
.node-btn:hover { transform: translateY(-2px); }
.node.done .node-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 5px 0 var(--accent-deep); }
.node.next .node-btn { border-color: var(--accent); color: var(--accent); box-shadow: 0 5px 0 var(--accent-deep); animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { outline: 0 solid transparent; } 50% { outline: 7px solid var(--accent-soft); } }
.node-label { display: grid; gap: 2px; text-decoration: none; color: var(--ink); min-width: 0; }
.node-label .code { font: 400 12px/1.2 var(--f-mono); color: var(--ink-2); }
.node-label .ttl { font-weight: 700; line-height: 1.3; }
.node.next .node-label .ttl::after { content: "  Next"; font: 600 11px/1 var(--f-mono); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }

/* lesson */
.lesson { max-width: 760px; display: grid; gap: 26px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; color: var(--ink-2); }
.crumbs a { font-weight: 700; text-decoration: none; }
.lesson-title { display: grid; gap: 10px; }
.lesson-title h1 { font-size: clamp(30px, 4.4vw, 48px); font-weight: 850; font-stretch: 108%; line-height: 1.03; letter-spacing: -0.02em; }
.steps { display: flex; flex-wrap: wrap; gap: 8px; }
.steps button { font: 700 13px/1 var(--f-body); padding: 9px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.prose { display: grid; gap: 14px; font-size: 17px; line-height: 1.68; }
.prose h4 { font-size: 19px; font-weight: 750; margin-top: 10px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.prose b { font-weight: 700; }
pre { margin: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.6 var(--f-mono); color: var(--ink); }
code { font-family: var(--f-mono); font-size: .88em; background: var(--panel-2); padding: .1em .35em; border-radius: 5px; }
pre code { background: none; padding: 0; font-size: inherit; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.tbl table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14.5px; line-height: 1.45; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl th { background: var(--panel-2); font: 700 12px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.tbl tr:last-child td { border-bottom: 0; }
ul.check { list-style: none; padding-left: 0; }
ul.check li::before { content: "□ "; color: var(--accent); font-family: var(--f-mono); }

.block { display: grid; gap: 12px; }
.block > h3 { font-size: 21px; font-weight: 800; font-stretch: 105%; }
.keys { background: var(--gold-soft); border-radius: var(--r); padding: 18px 20px; }
.keys ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.keys li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.keys li::before { content: "▸"; color: var(--gold); font-weight: 700; }
.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.srcs li { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.srcs a { font-weight: 700; text-decoration: none; color: var(--ink); overflow-wrap: anywhere; }
.srcs a:hover { color: var(--accent); text-decoration: underline; }
.srcs .note { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; }
.srcs .used { font: 400 12px/1.5 var(--f-mono); color: var(--ink-2); margin-top: 4px; }
.srcs .used a { font-weight: 400; color: var(--ink-2); }
@media (max-width: 560px) { .srcs li { grid-template-columns: minmax(0, 1fr); gap: 6px; } .srcs .chip { justify-self: start; } }
.buildbox { background: var(--accent-soft); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 8px; }
.buildbox h3 { color: var(--accent); }

.tutor { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 12px; }
.prompts { display: flex; flex-wrap: wrap; gap: 8px; }
.prompts button { font: 700 13px/1.2 var(--f-body); padding: 9px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; text-align: left; }
.ask { display: grid; gap: 10px; }
.ask textarea { width: 100%; resize: vertical; min-height: 64px; font: 400 16px/1.5 var(--f-body); padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.ask .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer { display: grid; gap: 10px; font-size: 16px; line-height: 1.65; }
.answer:empty { display: none; }
.answer .thinking { color: var(--ink-2); font-style: italic; }
.answer ul, .answer ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.answer h4, .answer h5 { font-size: 17px; font-weight: 750; }
.note-err { font-size: 14px; color: var(--short); }

.quiz-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; }
.qbar { height: 10px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--long); transition: width .3s; }
.quiz-card .q { font: 750 20px/1.3 var(--f-display); font-stretch: 102%; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--panel); color: var(--ink); font: 400 16px/1.4 var(--f-body); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .key { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; font: 700 13px/1 var(--f-mono); color: var(--ink-2); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--long); background: var(--long-soft); box-shadow: 0 3px 0 var(--long); }
.opt.wrong { border-color: var(--short); background: var(--short-soft); box-shadow: 0 3px 0 var(--short); }
.feedback { display: grid; gap: 10px; }
.feedback:empty { display: none; }
.verdict { font: 800 18px/1.2 var(--f-display); }
.verdict.ok { color: var(--long); }
.verdict.no { color: var(--short); }
.done-card { text-align: center; justify-items: center; padding: 28px 20px; }
.done-card .gain { font: 900 56px/1 var(--f-display); font-stretch: 125%; color: var(--gold); letter-spacing: -0.03em; }
.done-card .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.pager a { text-decoration: none; font-weight: 700; max-width: 48%; }
.pager .lbl { display: block; font: 400 12px/1.3 var(--f-mono); color: var(--ink-2); }

/* library / timeline / glossary / builds */
.lib-tools { display: grid; gap: 12px; margin-bottom: 18px; }
.count-line { font: 400 13px/1.4 var(--f-mono); color: var(--ink-2); }
.tl { display: grid; gap: 26px; }
.tl-year { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 16px; }
.tl-year h2 { font: 900 30px/1 var(--f-display); font-stretch: 125%; color: var(--accent); position: sticky; top: 16px; align-self: start; }
.tl-year ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; border-left: 2px solid var(--line); }
.tl-year li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding-left: 14px; position: relative; }
.tl-year li::before { content: ""; position: absolute; left: -6px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.tl-year .m { font: 600 12px/1.6 var(--f-mono); color: var(--ink-2); text-transform: uppercase; }
.tl-year .chip { margin-right: 8px; }
@media (max-width: 560px) { .tl-year { grid-template-columns: minmax(0, 1fr); gap: 8px; } .tl-year h2 { position: static; } .tl-year li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.gloss { display: grid; gap: 0; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.gloss div { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.gloss div:last-child { border-bottom: 0; }
.gloss dt { font-weight: 700; }
.gloss dd { margin: 0; color: var(--ink-2); }
@media (max-width: 560px) { .gloss div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.builds { display: grid; gap: 16px; }
.bcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 12px; }
.bcard-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.bcard h2 { font-size: 21px; font-weight: 800; font-stretch: 105%; }
.bcard .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.bcard .frac { font: 800 22px/1 var(--f-display); font-stretch: 120%; font-variant-numeric: tabular-nums; }
.steplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.steplist label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.steplist label:hover { background: var(--bg); }
.steplist input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.steplist input:checked + span { color: var(--ink-2); text-decoration: line-through; }
.blinks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.chat { display: grid; gap: 14px; }
.msg { display: grid; gap: 6px; padding: 14px 16px; border-radius: 14px; max-width: 100%; }
.msg.me { background: var(--accent-soft); justify-self: end; max-width: 88%; }
.msg.bot { background: var(--panel); border: 1px solid var(--line); }
