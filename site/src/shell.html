<title>Basis Points Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: thin sticky top bar (search, sections, reading settings); a docs-style course sidebar (units → lessons) beside one
   reading column; on phones the sidebar becomes a drawer. Calm surfaces: borders over shadows, one accent, serif for reading. */
:root {
  --bg: #F7F7F3; --panel: #FFFFFF; --panel-2: #F0F1EC; --ink: #151918; --ink-2: #454E4C; --ink-3: #6A7371; --line: #E2E4DE;
  --accent: #3634E6; --accent-ink: #FFFFFF; --accent-soft: #EEEEFE;
  --good: #0B7A51; --good-soft: #E3F4EC; --bad: #C2312F; --bad-soft: #FBE7E5; --gold: #95600F; --gold-soft: #FAF2E1;
  --f-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read: "Literata", Georgia, "Iowan Old Style", "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --prose-size: 19px; --prose-lh: 1.7; --measure: 68ch;
  --top: 56px; --side: 300px; --r: 12px;
  --c1: #3634E6; --c2: #95600F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1212; --panel: #161A1A; --panel-2: #1E2323; --ink: #E7EBE9; --ink-2: #B4BDBA; --ink-3: #8A9491; --line: #2A3130;
    --accent: #9290FF; --accent-ink: #0F1212; --accent-soft: #23233F;
    --good: #4BD196; --good-soft: #12301F; --bad: #FF7B76; --bad-soft: #3A1818; --gold: #EEB651; --gold-soft: #2C2312;
    --c1: #7F7DF5; --c2: #BD8626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1212; --panel: #161A1A; --panel-2: #1E2323; --ink: #E7EBE9; --ink-2: #B4BDBA; --ink-3: #8A9491; --line: #2A3130;
  --accent: #9290FF; --accent-ink: #0F1212; --accent-soft: #23233F;
  --good: #4BD196; --good-soft: #12301F; --bad: #FF7B76; --bad-soft: #3A1818; --gold: #EEB651; --gold-soft: #2C2312;
  --c1: #7F7DF5; --c2: #BD8626;
  color-scheme: dark;
}
:root[data-font="sans"] { --f-read: var(--f-ui); }
:root[data-size="s"] { --prose-size: 17px; }
:root[data-size="l"] { --prose-size: 21px; --measure: 64ch; }
@media (max-width: 600px) { :root { --prose-size: 18px; } :root[data-size="s"] { --prose-size: 16px; } :root[data-size="l"] { --prose-size: 20px; } }

html { scroll-padding-top: calc(var(--top) + 20px); }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--panel); }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--ink-2); }
.small { font-size: 13.5px; color: var(--ink-3); }

/* ---------- top bar ---------- */
.topbar { min-width: 0; overflow: visible; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--top); display: flex; align-items: center; gap: 12px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 14px/1 var(--f-ui); font-stretch: 115%; }
.brand-name { font-weight: 750; font-size: 15.5px; letter-spacing: -0.01em; white-space: nowrap; }
.sections { display: flex; gap: 2px; margin-left: 12px; }
.sections a { padding: 7px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.sections a:hover { color: var(--ink); background: var(--panel-2); }
.sections a[aria-current="page"] { color: var(--ink); background: var(--panel-2); }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.iconbtn { height: 36px; min-width: 36px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-grid; place-items: center; font-weight: 700; font-size: 14px; }
.iconbtn:hover { background: var(--panel-2); }
.menu-btn { display: none; }

/* search */
.search { position: relative; width: min(320px, 32vw); }
.search input { width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 0 34px 0 34px; font: 400 14.5px/1 var(--f-ui); }
.search input:focus { background: var(--panel); outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 600 11px/1 var(--f-mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; background: var(--panel); }
.search input:focus + kbd { display: none; }
.results { position: absolute; top: calc(100% + 6px); right: 0; width: min(480px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; z-index: 50;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 32px rgba(0,0,0,.14); padding: 6px; }
.results a { display: grid; gap: 2px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.results a[aria-selected="true"], .results a:hover { background: var(--accent-soft); }
.results .r-t { font-weight: 650; }
.results .r-m { font-size: 12.5px; color: var(--ink-3); }
.results .r-s { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.results .r-empty { padding: 12px 10px; color: var(--ink-2); }
.results mark { background: var(--gold-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

/* reading settings popover */
.aa { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 50; width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 12px 32px rgba(0,0,0,.14); padding: 14px; display: grid; gap: 12px; }
.pop .row { display: grid; gap: 6px; }
.pop .lbl { font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { height: 34px; border: 0; background: var(--panel); cursor: pointer; font-weight: 600; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body[data-wide] .shell { grid-template-columns: minmax(0, 1fr); }
body[data-wide] .sidenav { display: none; }
main { min-width: 0; padding: 36px 0 96px clamp(16px, 4vw, 56px); }
body[data-wide] main { padding-left: 0; }
main:focus { outline: none; }

/* ---------- sidebar ---------- */
.sidenav { position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px));
  overflow-y: auto; overscroll-behavior: contain; border-right: 1px solid var(--line); padding: 20px 16px 40px 0; display: grid; align-content: start; gap: 14px; }
.side-mobile { display: none; }
.side-label { font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.sidenav select { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 10px; font: 600 14.5px/1 var(--f-ui); }
.side-progress { font-size: 13.5px; color: var(--ink-2); }
.side-progress b { color: var(--ink); }
.bar { height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.units { display: grid; gap: 2px; margin-top: 4px; }
.unav summary { list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.unav summary::-webkit-details-marker { display: none; }
.unav summary:hover { background: var(--panel-2); }
.unav .unum { font: 600 12px/1 var(--f-mono); color: var(--ink-3); }
.unav .ut { font-weight: 650; font-size: 14.5px; line-height: 1.3; }
.unav .uc { font: 400 12px/1 var(--f-mono); color: var(--ink-3); }
.unav ol { list-style: none; margin: 2px 0 8px; padding: 0 0 0 26px; display: grid; gap: 1px; }
.lnk { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; align-items: start; padding: 6px 8px; border-radius: 7px; text-decoration: none; color: var(--ink-2); font-size: 14px; line-height: 1.35; }
.lnk:hover { background: var(--panel-2); color: var(--ink); }
.lnk[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 650; }
.dot { width: 14px; height: 14px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--panel); }
.done .dot { background: var(--good); border-color: var(--good); }
.side-foot { display: grid; gap: 8px; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-3); text-decoration: underline; cursor: pointer; font-size: 13px; justify-self: start; }

/* ---------- phones: drawer ---------- */
@media (max-width: 899px) {
  .menu-btn { display: inline-grid; }
  .sections, .topbar .search { display: none; }
  .brand { min-width: 0; }
  .brand-name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  main { padding: 24px 0 80px; }
  body[data-wide] .sidenav, .sidenav { display: grid; position: fixed; z-index: 55; top: 0; left: 0; bottom: 0; height: auto; width: min(88vw, 360px);
    background: var(--bg); border-right: 1px solid var(--line); transform: translateX(-105%); transition: transform .22s ease; visibility: hidden;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  body[data-drawer] .sidenav { transform: none; visibility: visible; }
  .side-mobile { display: grid; gap: 12px; }
  .side-mobile .search { width: 100%; }
  .side-mobile .results { left: 0; right: 0; width: auto; }
  .side-mobile nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .side-mobile nav a { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; background: var(--panel); }
  .side-mobile nav a[aria-current="page"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
}
@media (min-width: 900px) and (max-width: 1120px) { .brand-name { display: none; } :root { --side: 270px; } }
.scrim { position: fixed; inset: 0; z-index: 54; background: rgba(0,0,0,.35); }

/* ---------- shared page bits ---------- */
.page { max-width: 960px; display: grid; gap: 28px; }
.h1 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 750; line-height: 1.15; }
.h2 { font-size: 20px; font-weight: 700; line-height: 1.25; }
.h3 { font-size: 15px; font-weight: 700; }
.sub { font-size: 17px; color: var(--ink-2); max-width: 70ch; line-height: 1.55; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; font-weight: 650; font-size: 14.5px; cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.chip-btn:hover { color: var(--ink); }
.chip-btn[aria-checked="true"], .chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tag { display: inline-block; font-size: 12px; font-weight: 650; color: var(--ink-3); background: var(--panel-2); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.input { width: 100%; height: 42px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 12px; font: 400 15px/1 var(--f-ui); }
.empty { padding: 20px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--ink-2); }

/* ---------- course home ---------- */
.home-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-2); }
.home-stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.continue { display: grid; gap: 6px; padding: 20px 22px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); text-decoration: none; color: var(--ink); max-width: 720px; }
.continue:hover { border-color: var(--accent); }
.continue .c-label { font-size: 13px; font-weight: 700; color: var(--accent); }
.continue .c-title { font-size: 21px; font-weight: 700; line-height: 1.25; }
.continue .c-meta { font-size: 13.5px; color: var(--ink-3); }
.continue .c-sum { font-family: var(--f-read); font-size: 16.5px; color: var(--ink-2); line-height: 1.5; }
.unit-list { display: grid; gap: 8px; }
.ucard { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.ucard summary { list-style: none; display: grid; grid-template-columns: 64px minmax(0, 1fr) 120px; gap: 12px; align-items: center; padding: 14px 18px; cursor: pointer; }
.ucard summary::-webkit-details-marker { display: none; }
.ucard[open] summary { border-bottom: 1px solid var(--line); }
.ucard .unum { font: 600 12.5px/1 var(--f-mono); color: var(--ink-3); }
.ucard .ut { font-weight: 700; font-size: 16px; line-height: 1.3; }
.ucard .uprog { display: grid; gap: 5px; font: 400 12px/1 var(--f-mono); color: var(--ink-3); text-align: right; }
.ucard .ud { padding: 14px 18px 4px; color: var(--ink-2); max-width: 75ch; }
.llist { list-style: none; margin: 0; padding: 8px 10px 12px; display: grid; gap: 2px; }
.llist a { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.llist a:hover { background: var(--panel-2); }
.llist .lt { font-weight: 550; }
.llist .ls { display: block; font-size: 13.5px; color: var(--ink-3); font-weight: 400; margin-top: 2px; line-height: 1.4; }
.llist .lm { font: 400 12px/1.6 var(--f-mono); color: var(--ink-3); }
@media (max-width: 600px) { .ucard summary { grid-template-columns: minmax(0, 1fr) 72px; } .ucard .unum { grid-column: 1 / -1; } .llist .ls { display: none; } }

/* ---------- lesson ---------- */
.lesson { max-width: 760px; display: grid; gap: 26px; }
.crumb { font-size: 13.5px; color: var(--ink-3); }
.crumb a { color: var(--ink-2); text-decoration: none; font-weight: 600; }
.crumb a:hover { color: var(--accent); }
.lesson-head { display: grid; gap: 10px; }
.lesson h1 { font-size: clamp(28px, 3.4vw, 38px); font-weight: 750; line-height: 1.15; letter-spacing: -0.02em; }
.meta { font-size: 14px; color: var(--ink-3); }
.meta .ok { color: var(--good); font-weight: 650; }
.lede { font-family: var(--f-read); font-size: calc(var(--prose-size) + 1px); line-height: 1.5; color: var(--ink-2); max-width: var(--measure); }
.keys { background: var(--panel-2); border-radius: var(--r); padding: 16px 20px; display: grid; gap: 8px; }
.keys ul { margin: 0; padding-left: 1.2em; display: grid; gap: 5px; }
.keys li { line-height: 1.45; }
.prose { display: grid; gap: 1em; font-family: var(--f-read); font-size: var(--prose-size); line-height: var(--prose-lh); }
.prose > p, .prose > ul, .prose > ol, .prose > h4 { max-width: var(--measure); }
.prose p { text-wrap: pretty; }
.prose h4 { font-family: var(--f-ui); font-size: 1.25em; font-weight: 750; line-height: 1.25; letter-spacing: -0.01em; margin: 1.1em 0 -.1em; }
.prose ul, .prose ol { margin: 0; padding-left: 1.25em; display: grid; gap: .45em; }
.prose b { font-weight: 700; }
.prose code { font-size: .8em; }
/* lesson blocks: display formula, worked example, incident callout, inline figure */
.prose .formula { max-width: var(--measure); display: grid; gap: 8px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 10px 10px 0; }
.prose .eq { font-family: var(--f-mono); font-size: .85em; line-height: 1.6; color: var(--ink); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.prose .legend { font-family: var(--f-ui); font-size: 13.5px; color: var(--ink-3); line-height: 1.5; margin: 0; }
.prose .ex { max-width: var(--measure); display: grid; gap: 12px; padding: 16px 18px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); font-size: .92em; }
.prose .ex-t { font-family: var(--f-ui); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin: 0; }
.prose .ex table { border-collapse: collapse; width: 100%; font-family: var(--f-ui); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.prose .ex td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose .ex td + td { color: var(--ink-2); }
.prose .ex td:last-child { text-align: right; white-space: nowrap; }
.prose .ex tr:last-child td { border-bottom: 0; }
.prose .ex .eq { background: var(--panel); border-radius: 8px; padding: 10px 12px; }
.prose .callout { max-width: var(--measure); display: grid; gap: 6px; padding: 16px 20px; border-radius: var(--r); background: var(--accent-soft); }
.prose .c-t { font-family: var(--f-ui); font-size: 13px; font-weight: 700; color: var(--accent); margin: 0; }
.prose .fig { max-width: var(--measure); margin: .4em 0; display: grid; gap: 8px; color: var(--ink); }
.prose .fig svg { width: 100%; height: auto; display: block; }
.prose .fig figcaption { font-family: var(--f-ui); font-size: 13.5px; color: var(--ink-3); line-height: 1.5; }
@media (max-width: 700px) { .prose .ex { padding: 14px 14px 16px; } .prose .ex table { font-size: 13px; } .prose .ex td { padding: 6px 0; } .prose .ex td + td { padding-left: 8px; } .prose .ex td:last-child { white-space: normal; } }
pre { margin: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.6 var(--f-mono); color: var(--ink); tab-size: 4; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--panel-2); padding: .1em .35em; border-radius: 5px; }
pre code { background: none; padding: 0; font-size: inherit; }
@media (max-width: 700px) { pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; } }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-family: var(--f-ui); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.45; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl th { background: var(--panel-2); font-size: 13px; font-weight: 700; color: var(--ink-2); }
.tbl tr:last-child td { border-bottom: 0; }
@media (max-width: 700px) {
  .tbl { border: 0; background: none; }
  .tbl table, .tbl tbody, .tbl tr, .tbl td { display: block; width: auto; box-sizing: border-box; }
  .tbl td { overflow-wrap: anywhere; }
  .tbl thead { display: none; }
  .tbl tr { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 8px; padding: 6px 0; }
  .tbl td { border: 0; padding: 5px 12px; }
  .tbl td[data-label]::before { content: attr(data-label); display: block; font-size: 12px; font-weight: 700; color: var(--ink-3); }
}
.sect { display: grid; gap: 12px; }
.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

/* quiz: every question visible; click an option for instant feedback */

/* tutor */
.tutor { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }

.bcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 10px; }
